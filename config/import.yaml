# Wikidata import configuration.
#
# Everything that controls the content and balance of the knowledge graph lives here.
# Changing this file and rerunning the importer rebuilds the graph; no code changes needed.
#
# Fame score = number of Wikipedia sitelinks of an entity. Entities below the relevant
# threshold are not imported at all. These thresholds are the only fame filter: every
# imported entity can appear in questions, and every entity type gets the same share of
# question starts. To make a type less obscure, raise its threshold here.

wikidata:
  endpoint: https://query.wikidata.org/sparql
  # Wikidata asks for a descriptive User-Agent with a way to contact the operator.
  user_agent: "TriviaArcade/0.1 (https://github.com/Markus1320/TriviaArcade) knowledge graph importer"
  min_interval_seconds: 2.0 # pause between two requests
  timeout_seconds: 90
  max_retries: 4
  batch_size: 100 # entities per statement query
  label_batch_size: 100 # entities per label query (label queries are slower)

# Languages for labels and aliases. English is required: it is the main label.
languages: [en, de]
# Main label when there is no English one. Wikidata stores many names (e.g. "Oslo", "euro")
# under "mul" (identical in many languages) instead of repeating them for English.
label_fallback_languages: [mul]

# Default fame threshold for the seed entity types below.
fame_threshold: 80
# Threshold for entities that are only reached through a relation (people, languages, ...).
related_fame_threshold: 100
# Numeric facts (population, area, ...) and numeric tier years are only stored for
# entities at or above this threshold.
numeric_fame_threshold: 250

# Entities that are never imported, e.g. ambiguous groupings that would make questions unclear.
exclude_entities:
  - Q27527 # Afro-Eurasia
  - Q828 # Americas
  - Q3960 # Australian continent (Oceania is used instead)
  - Q897 # gold (reached as a "currency")
  - Q41207 # coin (reached as a "currency")
  # Too generic as a game "platform"
  - Q17517 # mobile phone
  - Q466 # World Wide Web
  - Q6368 # web browser
  - Q22645 # smartphone
  - Q16338 # personal computer
  - Q483639 # cloud computing
  - Q8076 # video game console (the class itself)
  - Q165194 # application programming interface
  # Too generic as a "position held"
  - Q121594 # professor
  - Q161944 # deacon
  - Q486839 # member of parliament
  - Q484876 # chief executive officer
  - Q121998 # ambassador
  - Q190353 # Sovereign Military Order of Malta (reached as an "award")

# Seed entity types. Every entity whose "instance of" (P31) is one of the classes and whose
# fame reaches the threshold is imported. The first matching type in this list wins.
# max_entities keeps large types from dominating: only the most famous ones are kept.
entity_types:
  continent:
    classes: [Q5107] # continent
    fame_threshold: 50
  ocean:
    classes: [Q9430] # ocean
    fame_threshold: 100 # drops sub-oceans such as "North Pacific Ocean"
  # Before country: Wikidata also tags many former states as "country" or "sovereign state".
  # "realm" (Q1250464) is not used here: current kingdoms such as Spain carry it too.
  historical_state:
    classes: [Q3024240, Q48349, Q28171280] # historical country, empire, ancient civilization
    fame_threshold: 80
    max_entities: 200
  country:
    classes: [Q3624078, Q6256] # sovereign state, country
    fame_threshold: 50
  city:
    classes: [Q515, Q1549591, Q5119] # city, big city, capital city
    fame_threshold: 150
    max_entities: 300
  river:
    classes: [Q4022]
  mountain:
    classes: [Q8502]
  mountain_range:
    classes: [Q46831]
    fame_threshold: 60
  lake:
    classes: [Q23397]
