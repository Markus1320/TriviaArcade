# Types that are never queried directly, only assigned to entities reached through a
# relation. A reached entity whose P31 matches none of the entity or related types is dropped
# unless the relation defines a fallback_target_type.
related_types:
  person:
    classes: [Q5] # human
  language:
    classes: [Q34770, Q1288568, Q33742, Q45762] # language, modern, natural, dead language
  currency:
    classes: [Q8142]
  # Positions, awards and platforms mostly come from a relation's fallback_target_type:
  # whatever a person's award or a game's platform points to is taken as an award or platform.
  position:
    classes: [Q4164871]
  award:
    classes: [Q618779]
  genre:
    classes: [Q483394, Q201658, Q223393] # genre, film genre, literary genre
  platform:
    classes: [Q8076] # video game console

# Relation allowlist. Relations are read from seed entities; relations marked
# from_related are also read from reached entities, but only towards entities that are
# already in the graph. name becomes the Neo4j relationship type.
#   target_fame_threshold: overrides related_fame_threshold for targets of this relation
#   fallback_target_type:  type for reached targets whose P31 matches no configured type
#   best_rank_only:        only the current value (Wikidata's best rank), no historical ones
relations:
  - { property: P36, name: CAPITAL, target_fame_threshold: 120, fallback_target_type: city, best_rank_only: true }
  - { property: P47, name: SHARES_BORDER_WITH }
  - { property: P30, name: CONTINENT, best_rank_only: true }
  - { property: P17, name: COUNTRY, best_rank_only: true }
  - { property: P131, name: LOCATED_IN, best_rank_only: true }
  - { property: P206, name: NEXT_TO_BODY_OF_WATER }
  - { property: P4552, name: MOUNTAIN_RANGE }
  - { property: P403, name: MOUTH }
  - { property: P37, name: OFFICIAL_LANGUAGE, target_fame_threshold: 80, fallback_target_type: language, best_rank_only: true }
  - { property: P38, name: CURRENCY, target_fame_threshold: 80, fallback_target_type: currency, best_rank_only: true }
  - { property: P35, name: HEAD_OF_STATE }
  - { property: P6, name: HEAD_OF_GOVERNMENT }
  - { property: P112, name: FOUNDED_BY }
  - { property: P710, name: PARTICIPANT }
  - { property: P276, name: LOCATION }
  - { property: P361, name: PART_OF }
  - { property: P1365, name: REPLACES }
  - { property: P1366, name: REPLACED_BY }
  - { property: P138, name: NAMED_AFTER }
  - { property: P19, name: PLACE_OF_BIRTH, from_related: true }
  - { property: P20, name: PLACE_OF_DEATH, from_related: true }
  - { property: P607, name: PARTICIPATED_IN_CONFLICT, from_related: true }
  # People
  - { property: P27, name: COUNTRY_OF_CITIZENSHIP, from_related: true }
  - { property: P39, name: POSITION_HELD, target_fame_threshold: 60, fallback_target_type: position, from_related: true }
  - { property: P166, name: AWARD_RECEIVED, target_fame_threshold: 80, fallback_target_type: award, from_related: true }
  - { property: P800, name: NOTABLE_WORK, from_related: true }
  - { property: P135, name: MOVEMENT }
  - { property: P102, name: MEMBER_OF_POLITICAL_PARTY, from_related: true }
  - { property: P26, name: SPOUSE }
  - { property: P22, name: FATHER }
  - { property: P54, name: MEMBER_OF_SPORTS_TEAM, from_related: true }
  # Works: films, series, games, books, music, art
  - { property: P57, name: DIRECTOR }
  - { property: P161, name: CAST_MEMBER }
  - { property: P50, name: AUTHOR }
  - { property: P170, name: CREATOR }
  - { property: P175, name: PERFORMER }
  - { property: P86, name: COMPOSER }
  - { property: P178, name: DEVELOPER }
  - { property: P123, name: PUBLISHER }
  - { property: P400, name: PLATFORM, target_fame_threshold: 60, fallback_target_type: platform }
  # No fallback type: "genre" statements point at too many unrelated things.
  - { property: P136, name: GENRE, target_fame_threshold: 80 }
  - { property: P495, name: COUNTRY_OF_ORIGIN }
  - { property: P840, name: NARRATIVE_LOCATION }
  - { property: P1441, name: PRESENT_IN_WORK }
  - { property: P179, name: PART_OF_THE_SERIES }
  # Organisations, buildings, science, sport
  - { property: P159, name: HEADQUARTERS_LOCATION, best_rank_only: true }
  - { property: P127, name: OWNED_BY, best_rank_only: true }
  - { property: P176, name: MANUFACTURER }
  - { property: P84, name: ARCHITECT }
  - { property: P740, name: LOCATION_OF_FORMATION }
  - { property: P61, name: DISCOVERER_OR_INVENTOR }
  - { property: P397, name: PARENT_ASTRONOMICAL_BODY }
  - { property: P641, name: SPORT, target_fame_threshold: 80, fallback_target_type: sport }

# Numeric facts, only for entities at or above numeric_fame_threshold.
# unit refers to unit_conversions below; null means unitless (e.g. population).
# with_year also stores the reference year (<name>_year) of the chosen value.
numeric_properties:
  - { property: P1082, name: population, unit: null, with_year: true }
  - { property: P2046, name: area_km2, unit: km2 }
  - { property: P2043, name: length_km, unit: km }
  - { property: P2044, name: elevation_m, unit: m }

# Wikidata unit item -> factor that converts a value into the target unit.
unit_conversions:
  km2: { Q712226: 1.0, Q25343: 0.000001, Q35852: 0.01, Q232291: 2.589988 }
  km: { Q828224: 1.0, Q11573: 0.001, Q253276: 1.609344 }
  m: { Q11573: 1.0, Q3710: 0.3048, Q828224: 1000.0 }

# Years stored as node properties. Only values with at least year precision are used.
# Negative years are BCE (44 BC = -44).
#   tier base:    stored for every imported entity (dates of major events)
#   tier numeric: only for entities at or above numeric_fame_threshold
date_properties:
  - { property: P585, name: year, tier: base } # point in time
  - { property: P580, name: start_year, tier: base }
  - { property: P582, name: end_year, tier: base }
  - { property: P577, name: publication_year, tier: base } # films, games, books, albums
  - { property: P571, name: inception_year, tier: numeric }
  - { property: P576, name: dissolved_year, tier: numeric }
  - { property: P569, name: birth_year, tier: numeric }
  - { property: P570, name: death_year, tier: numeric }
