# TriviaArcade.
#
#   docker compose up -d --build                       the game on http://localhost:8080
#   docker compose --profile offline up -d neo4j       the knowledge graph, with its Browser
#   docker compose --profile offline run --rm importer rebuild the graph from Wikidata
#   docker compose --profile offline run --rm poolgen --language en --walks 100
#                                                      make questions (needs an LLM)
#
# Only the game publishes a port to the network. Services with "profiles: [offline]" are
# left out unless --profile offline is given; the game never needs them.

services:
  game:
    build: .
    image: triviaarcade
    restart: unless-stopped
    ports:
      - "${GAME_PORT:-8080}:8000"
    environment:
      ANSWER_TIME_SECONDS: ${ANSWER_TIME_SECONDS:-30}
      LIFE_COMBO: ${LIFE_COMBO:-3}
      MAX_LIVES: ${MAX_LIVES:-3}
      START_LIVES: ${START_LIVES:-1}
    volumes:
      # The question pool, read only. New questions are picked up without a restart.
      - ./pool:/app/pool:ro
      # The SQLite database data/game.db (players, runs, questions asked).
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=10)",
        ]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 5s

  # --- Offline: making questions. Not needed to play. ---

  neo4j:
    image: neo4j:5-community
    profiles: ["offline"]
    restart: unless-stopped
    environment:
      # NEO4J_PASSWORD comes from .env (at least 8 characters).
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    ports:
      # Only reachable from this computer: the Browser on http://localhost:7474.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Wikidata into Neo4j, configured by config/import.yaml. Wikidata's answers are cached
  # in data/raw. Options go after the service name, e.g. "importer --dry-run --names":
  # the command is "python -m offline.importer" plus what you add.
  importer:
    build: .
    image: triviaarcade
    profiles: ["offline"]
    entrypoint: ["python", "-m", "offline.importer"]
    command: []
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy

  # Walks through the graph and lets the LLM write questions into pool/. Options go after
  # the service name: "poolgen --language en --walks 100" (see offline/poolgen.py).
  poolgen:
    build: .
    image: triviaarcade
    profiles: ["offline"]
    entrypoint: ["python", "-m", "offline.poolgen"]
    command: ["--help"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      # For an Ollama on this computer: http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LLM_GENERATOR_MODEL: ${LLM_GENERATOR_MODEL:-}
      LLM_CRITIC_MODEL: ${LLM_CRITIC_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      WALK_MIN_HOPS: ${WALK_MIN_HOPS:-1}
      WALK_MAX_HOPS: ${WALK_MAX_HOPS:-2}
      WALK_HUB_PENALTY: ${WALK_HUB_PENALTY:-0.5}
    volumes:
      # Written: new questions are appended to pool/<language>.jsonl.
      - ./pool:/app/pool
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
