# TriviaArcade.
#
#   docker compose up -d --build                       the game on http://localhost:8080
#   docker compose --profile offline up -d neo4j       the knowledge graph, with its Browser
#   docker compose --profile offline run --rm importer rebuild the graph from Wikidata
#
# Only the game publishes a port to the network. Services with "profiles: [offline]" are
# left out unless --profile offline is given; the game never needs them.

services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "${GAME_PORT:-8080}:8000"
    environment:
      ANSWER_TIME_SECONDS: ${ANSWER_TIME_SECONDS:-30}
      LIFE_COMBO: ${LIFE_COMBO:-3}
      MAX_LIVES: ${MAX_LIVES:-3}
      START_LIVES: ${START_LIVES:-1}
    volumes:
      # The question pool, read only. New questions are picked up without a restart.
      - ./pool:/app/pool:ro
      # The SQLite database data/game.db (players, runs, questions asked).
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=10)",
        ]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 5s

  # --- Offline: making questions. Not needed to play. ---

  neo4j:
    image: neo4j:5-community
    profiles: ["offline"]
    restart: unless-stopped
    environment:
      # NEO4J_PASSWORD comes from .env (at least 8 characters).
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    ports:
      # Only reachable from this computer: the Browser on http://localhost:7474.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Wikidata import into Neo4j (still the old code in backend/ until step 4 of
  # docs/simplification-plan.md moves it to offline/).
  importer:
    build: ./backend
    profiles: ["offline"]
    command: ["python", "-m", "importer"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
      - ./config:/config:ro
      - ./data:/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
