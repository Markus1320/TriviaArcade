# The same checks as on your PC, on every push. scripts/deploy.sh deploys only after this
# run succeeded.
name: CI

on:
  push:
  pull_request:

jobs:
  # game/, offline/ and tests/: ruff (lint and format) and pytest. No test calls an LLM.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type check and build
        run: npm run build

  # The compose file is valid and the one image builds.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose --profile offline config --quiet
      - name: Build the image
        run: docker compose build game
